<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Công việc chuẩn bị Tết</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .card {
            width: 450px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #c62828;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h2 {
            margin: 0;
            font-size: 22px;
        }

        .header p {
            margin: 8px 0 0;
            font-size: 13px;
            opacity: 0.9;
        }

        .todo-list {
            padding: 20px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #eee;
            background-color: #fff9f9;
        }

        .circle {
            width: 20px;
            height: 20px;
            border: 2px solid #ff8a80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .todo-item.completed {
            background-color: #e8f5e9;
            border-color: #c8e6c9;
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-item.completed .circle {
            background-color: #4caf50;
            border-color: #4caf50;
        }

        .todo-item.completed .circle::after {
            content: '✓';
            color: white;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <h2>Công việc chuẩn bị Tết</h2>
            <p>Click để đánh dấu hoàn thành</p>
        </div>
        <div class="todo-list" id="todoContainer"></div>
        <div class="footer">Trạng thái được lưu tự động vào localStorage</div>
    </div>

    <script>
        // 1. Dữ liệu mặc định ban đầu
        const initialTodos = [
            { id: 1, task: "Mua bánh chưng", done: false },
            { id: 2, task: "Dọn nhà đón Tết", done: false },
            { id: 3, task: "Gói bánh chưng", done: false },
            { id: 4, task: "Trang trí nhà cửa bằng hoa mai, hoa đào", done: false },
            { id: 5, task: "Mua phong bao lì xì", done: false },
            { id: 6, task: "Chuẩn bị mâm ngũ quả", done: false }
        ];

        const container = document.getElementById('todoContainer');
        let myTodos = [];

        function render() {
            container.innerHTML = "";
            myTodos.forEach(item => {
                const div = document.createElement('div');
                div.className = `todo-item ${item.done ? 'completed' : ''}`;
                div.innerHTML = `
                <div class="circle"></div>
                <span class="task-text">${item.task}</span>
            `;

                div.onclick = () => toggleTask(item.id);
                container.appendChild(div);
            });
        }

        function toggleTask(id) {
            const index = myTodos.findIndex(t => t.id === id);
            if (index !== -1) {
                myTodos[index].done = !myTodos[index].done;
                localStorage.setItem("myTodos", JSON.stringify(myTodos));
                render();
            }
        }

        function init() {
            const stored = localStorage.getItem("myTodos");
            if (stored) {
                myTodos = JSON.parse(stored);
            } else {
                myTodos = initialTodos;
                localStorage.setItem("myTodos", JSON.stringify(myTodos));
            }
            render();
        }

        init();
    </script>

</body>

</html>
