<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Công việc chuẩn bị Tết - Nâng cao</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .card {
            width: 450px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #c62828;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .input-group {
            display: flex;
            padding: 20px;
            gap: 10px;
            background-color: #fff9f9;
        }

        input#newTask {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button#addBtn {
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .todo-list {
            padding: 0 20px 20px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid #eee;
            background-color: #fff;
        }

        .circle {
            width: 20px;
            height: 20px;
            border: 2px solid #ff8a80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .todo-item.completed {
            background-color: #e8f5e9;
            border-color: #c8e6c9;
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-item.completed .circle {
            background-color: #4caf50;
            border-color: #4caf50;
        }

        .todo-item.completed .circle::after {
            content: '✓';
            color: white;
            font-size: 14px;
        }

        .footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <h2>Công việc chuẩn bị Tết</h2>
            <p>Thêm công việc mới & đánh dấu hoàn thành</p>
        </div>

        <div class="input-group">
            <input type="text" id="newTask" placeholder="Nhập công việc mới...">
            <button id="addBtn">Thêm</button>
        </div>

        <div class="todo-list" id="todoContainer"></div>
        <div class="footer">Dữ liệu được lưu tự động vào localStorage</div>
    </div>

    <script>
        const initialTodos = [
            { id: 1, task: "Mua bánh chưng", done: false },
            { id: 2, task: "Dọn nhà đón Tết", done: false },
            { id: 3, task: "Gói bánh chưng", done: false },
            { id: 4, task: "Trang trí nhà cửa bằng hoa mai, hoa đào", done: false },
            { id: 5, task: "Mua phong bao lì xì", done: false },
            { id: 6, task: "Chuẩn bị mâm ngũ quả", done: false }
        ];

        let myTodos = JSON.parse(localStorage.getItem("myTodos")) || [];
        const container = document.getElementById('todoContainer');
        const inputTask = document.getElementById('newTask');
        const addBtn = document.getElementById('addBtn');

        function render() {
            container.innerHTML = "";
            myTodos.forEach(item => {
                const div = document.createElement('div');
                div.className = `todo-item ${item.done ? 'completed' : ''}`;
                div.innerHTML = `<div class="circle"></div><span class="task-text">${item.task}</span>`;
                div.onclick = () => toggleTask(item.id);
                container.appendChild(div);
            });
        }
        function addTask() {
            const text = inputTask.value.trim();
            if (text === "") {
                alert("Vui lòng không để trống nội dung!");
                return;
            }

            const newTodo = {
                id: Date.now(),
                task: text,
                done: false
            };

            myTodos.unshift(newTodo);
            saveAndRender();
            inputTask.value = "";
        }

        function toggleTask(id) {
            myTodos = myTodos.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem("myTodos", JSON.stringify(myTodos));
            render();
        }

        addBtn.onclick = addTask;

        inputTask.onkeypress = (e) => {
            if (e.key === 'Enter') addTask();
        };

        function init() {
            if (myTodos.length === 0 && !localStorage.getItem("myTodos")) {
                myTodos = initialTodos;
                localStorage.setItem("myTodos", JSON.stringify(myTodos));
            }
            render();
        }

        init();
    </script>

</body>

</html>
