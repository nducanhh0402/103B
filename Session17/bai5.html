<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Quản lý công việc Tết - Pro Version</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .card {
            width: 500px;
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header {
            background-color: #c62828;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .input-group {
            display: flex;
            padding: 20px;
            gap: 10px;
            background-color: #fff9f9;
        }

        input#newTask {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            outline: none;
        }

        button#addBtn {
            padding: 10px 20px;
            background-color: #ff9800;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .todo-list {
            padding: 0 20px 20px;
        }

        .todo-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 15px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #eee;
            background-color: #fff;
            transition: 0.3s;
        }

        .content-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .circle {
            width: 18px;
            height: 18px;
            border: 2px solid #ff8a80;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
        }

        .todo-item.completed {
            background-color: #e8f5e9;
            border-color: #c8e6c9;
        }

        .todo-item.completed .task-text {
            text-decoration: line-through;
            color: #888;
        }

        .todo-item.completed .circle {
            background-color: #4caf50;
            border-color: #4caf50;
        }

        .todo-item.completed .circle::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }

        .edit-input {
            flex: 1;
            padding: 5px 8px;
            border: 1px solid #2196F3;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-left: 10px;
        }

        .btn-icon {
            cursor: pointer;
            font-size: 16px;
            opacity: 0.6;
            transition: 0.2s;
        }

        .btn-icon:hover {
            opacity: 1;
        }

        .edit-icon:hover {
            color: #2196F3;
        }

        .delete-icon:hover {
            color: #d32f2f;
        }

        .footer {
            padding: 15px;
            text-align: center;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #eee;
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="header">
            <h2>Công việc chuẩn bị Tết</h2>
            <p>Thêm - Chỉnh sửa - Đánh dấu - Xóa</p>
        </div>

        <div class="input-group">
            <input type="text" id="newTask" placeholder="Nhập công việc mới...">
            <button id="addBtn">Thêm</button>
        </div>

        <div id="todoContainer" class="todo-list"></div>
        <div class="footer">Mọi thay đổi được lưu tự động - F5 để kiểm tra</div>
    </div>

    <script>
        const defaultData = [
            { id: 1, task: "Mua bánh chưng", done: false },
            { id: 2, task: "Dọn nhà đón Tết", done: false },
            { id: 3, task: "Gói bánh chưng", done: false }
        ];

        let myTodos = JSON.parse(localStorage.getItem("myTodos")) || [];
        let editingId = null;

        const container = document.getElementById('todoContainer');
        const inputMain = document.getElementById('newTask');

        function saveAndRender() {
            localStorage.setItem("myTodos", JSON.stringify(myTodos));
            render();
        }

        function render() {
            container.innerHTML = "";
            myTodos.forEach(item => {
                const isEditing = editingId === item.id;
                const div = document.createElement('div');
                div.className = `todo-item ${item.done ? 'completed' : ''}`;

                div.innerHTML = `
                <div class="content-group">
                    <div class="circle" onclick="toggleTask(${item.id})"></div>
                    ${isEditing
                        ? `<input type="text" class="edit-input" id="input-${item.id}" value="${item.task}">`
                        : `<span class="task-text">${item.task}</span>`
                    }
                </div>
                <div class="action-btns">
                    <span class="btn-icon edit-icon" onclick="startEdit(${item.id})">✏️</span>
                    <span class="btn-icon delete-icon" onclick="deleteTask(${item.id})">🗑️</span>
                </div>
            `;
                container.appendChild(div);

                if (isEditing) {
                    const editInp = document.getElementById(`input-${item.id}`);
                    editInp.focus();
                    editInp.select();

                    editInp.onkeydown = (e) => {
                        if (e.key === 'Enter') finishEdit(item.id, editInp.value);
                        if (e.key === 'Escape') { editingId = null; render(); }
                    };
                }
            });
        }

        function addTask() {
            const val = inputMain.value.trim();
            if (!val) return;
            myTodos.unshift({ id: Date.now(), task: val, done: false });
            inputMain.value = "";
            saveAndRender();
        }

        function toggleTask(id) {
            myTodos = myTodos.map(t => t.id === id ? { ...t, done: !t.done } : t);
            saveAndRender();
        }

        function deleteTask(id) {
            if (confirm("Xóa công việc này?")) {
                myTodos = myTodos.filter(t => t.id !== id);
                saveAndRender();
            }
        }

        function startEdit(id) {
            editingId = id;
            render();
        }

        function finishEdit(id, newTitle) {
            const trimmed = newTitle.trim();
            if (trimmed === "") {
                alert("Tên công việc không được để trống!");
                return;
            }
            myTodos = myTodos.map(t => t.id === id ? { ...t, task: trimmed } : t);
            editingId = null;
            saveAndRender();
        }

        document.getElementById('addBtn').onclick = addTask;
        inputMain.onkeypress = (e) => { if (e.key === 'Enter') addTask(); };

        function init() {
            if (myTodos.length === 0 && !localStorage.getItem("myTodos")) {
                myTodos = defaultData;
                localStorage.setItem("myTodos", JSON.stringify(myTodos));
            }
            render();
        }
        init();
    </script>

</body>

</html>
