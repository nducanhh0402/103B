<body>
    <script>
let soSachCu = prompt("Nhập số sách cũ:");
let soSachMoi = prompt("Nhập số sách mới nhập:");

let tongSoSach = Number(soSachCu) + Number(soSachMoi);

console.log("Tổng số sách hiện tại: " + tongSoSach);
document.write("Tổng số sách hiện tại: " + tongSoSach);
    </script>
</body>
