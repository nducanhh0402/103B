    <script>
let tenSach = prompt("Nhập tên sách:");
let namXuatBanStr = prompt("Nhập năm xuất bản:");
let namHienTaiStr = prompt("Nhập năm hiện tại:");

let namXuatBan = Number(namXuatBanStr);
let namHienTai = Number(namHienTaiStr);
let tuoiSach = namHienTai - namXuatBan;

console.log("Sách: " + tenSach);
console.log("Năm xuất bản: " + namXuatBan);
console.log("Tuổi của sách: " + tuoiSach + " năm");
    </script>
