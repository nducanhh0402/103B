<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let soLuotMuon = parseInt(prompt("Hôm nay có bao nhiêu lượt mượn sách?"));

while (isNaN(soLuotMuon) || soLuotMuon <= 0) {
    soLuotMuon = parseInt(prompt("Vui lòng nhập một số nguyên dương:"));
}

let danhSachMuon = [];

for (let i = 1; i <= soLuotMuon; i++) {
    console.log(`--- Lượt mượn thứ ${i} ---`);
    
    let tenNguoiMuon = prompt(`Nhập tên người mượn thứ ${i}:`);
    let tenSach = prompt(`Nhập tên sách:`);
    let soNgayMuon = parseInt(prompt(`Số ngày mượn (1-30):`));

    while (isNaN(soNgayMuon) || soNgayMuon < 1 || soNgayMuon > 30) {
        soNgayMuon = parseInt(prompt(`Vui lòng nhập số ngày hợp lệ (từ 1 đến 30):`));
    }

    if (soNgayMuon > 14) {
        console.log(`Người mượn: ${tenNguoiMuon} | Sách: ${tenSach}`);
        console.log("Cảnh báo: Thời gian mượn vượt quy định (tối đa 14 ngày)");
    } else {
        console.log(`Người mượn: ${tenNguoiMuon} | Sách: ${tenSach}`);
        console.log("Mượn thành công");
    }
}

console.log("----------------------------");
console.log(`TỔNG KẾT: Hôm nay có tổng cộng ${soLuotMuon} lượt mượn sách.`);
    </script>
    
</body>
</html>
