<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
let tongSoSach = 0;
let soSachMat = 0;
let soSachHetHang = 0;
let soSachTonKhoNhieu = 0;
let soSachTonKhoBinhThuong = 0;

while (true) {
    let tiepTuc = prompt("Tiếp tục kiểm kê sách tiếp theo? (có/không)").toLowerCase();

    if (tiepTuc === "không" || tiepTuc === "khong") {
        break; 
    } else if (tiepTuc !== "có" && tiepTuc !== "co") {
        alert("Vui lòng chỉ nhập 'có' hoặc 'không'.");
        continue;
    }

    let maSach = prompt("Nhập mã sách (không được để trống):");
    while (!maSach) {
        maSach = prompt("Mã sách không được để trống. Vui lòng nhập lại:");
    }

    let tenSach = prompt("Nhập tên sách:");

    let soLuongThucTe = parseInt(prompt("Số lượng thực tế đang có trong kho (>= 0):"));
    while (isNaN(soLuongThucTe) || soLuongThucTe < 0) {
        soLuongThucTe = parseInt(prompt("Vui lòng nhập số nguyên lớn hơn hoặc bằng 0:"));
    }

    let tinhTrang = parseInt(prompt("Tình trạng sách (1 - Bình thường, 2 - Mất):"));
    while (tinhTrang !== 1 && tinhTrang !== 2) {
        tinhTrang = parseInt(prompt("Vui lòng chỉ chọn 1 (Bình thường) hoặc 2 (Mất):"));
    }

    tongSoSach++;

    if (tinhTrang === 2) {
        console.log(`Sách: ${tenSach} - Phân loại: Sách mất`);
        soSachMat++;
    } 
    else if (tinhTrang === 1 && soLuongThucTe === 0) {
        console.log(`Sách: ${tenSach} - Phân loại: Sách hết (vẫn còn trong hệ thống)`);
        soSachHetHang++;
    } 
    else if (tinhTrang === 1 && soLuongThucTe >= 10) {
        console.log(`Sách: ${tenSach} - Phân loại: Sách tồn kho nhiều`);
        soSachTonKhoNhieu++;
    } 
    else if (tinhTrang === 1 && soLuongThucTe >= 1 && soLuongThucTe <= 9) {
        console.log(`Sách: ${tenSach} - Phân loại: Sách tồn kho bình thường`);
        soSachTonKhoBinhThuong++;
    }
}

console.log("-----------------------------------------");
console.log("BÁO CÁO KIỂM KÊ:");
console.log(`- Tổng số sách đã kiểm kê: ${tongSoSach} cuốn`);
console.log(`- Số sách mất: ${soSachMat} cuốn`);
console.log(`- Số sách hết hàng: ${soSachHetHang} cuốn`);
console.log(`- Số sách tồn kho nhiều: ${soSachTonKhoNhieu} cuốn`);
console.log(`- Số sách tồn kho bình thường: ${soSachTonKhoBinhThuong} cuốn`);</script>
</body>
</html>
