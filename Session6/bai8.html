<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var n = 7;
        var arr = [0, 1, 1, 2, 3, 5, 8];
        var result = "Là dãy số fibonacci";

        if (n < 0) {
            result = "Số lượng phần tử không được nhỏ hơn 0";
        } else if (n === 0 || arr.length !== n) {
            result = "Không phải dãy số fibonacci";
        } else {
            if (arr[0] !== 0) {
                result = "Không phải dãy số fibonacci";
            } else if (n > 1 && arr[1] !== 1) {
                result = "Không phải dãy số fibonacci";
            } else {
                for (var i = 2; i < n; i++) {
                    if (arr[i] !== arr[i - 1] + arr[i - 2]) {
                        result = "Không phải dãy số fibonacci";
                        break;
                    }
                }
            }
        }

        console.log(result);
    </script>
</body>

</html>
