<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quan Ly Sach</title>
</head>
<body>
    <script>
        function quanLyKhoSach() {
            let lanThu = 0;
            let loginThanhCong = false;

            while (lanThu < 3) {
                let user = prompt("Tên đăng nhập:");
                let pass = prompt("Mật khẩu:");

                if (user === "admin" && pass === "123") {
                    alert("Đăng nhập thành công!");
                    loginThanhCong = true;
                    break; 
                } else {
                    lanThu++;
                    alert("Sai! Còn " + (3 - lanThu) + " lần thử.");
                }
            }

            if (loginThanhCong === false) {
                alert("Khoá tài khoản!");
                return;
            }

            let danhSach = ["Toán", "Văn", "Anh"];
            let menu;

            do {
                menu = prompt(
                    "1. Thêm sách\n2. Xem sách\n3. Tìm sách\n4. Đổi tên\n5. Thoát"
                );

                if (menu === "1") {
                    let sachMoi = prompt("Nhập tên sách:");
                    danhSach.push(sachMoi);
                } 
                else if (menu === "2") {
                    let ketQua = "";
                    for (let i = 0; i < danhSach.length; i++) {
                        ketQua = ketQua + (i + 1) + ". " + danhSach[i] + "\n";
                    }
                    alert(ketQua);
                } 
                else if (menu === "3") {
                    let timTen = prompt("Tên sách cần tìm:");
                    let found = false;
                    for (let i = 0; i < danhSach.length; i++) {
                        if (danhSach[i] === timTen) {
                            alert("Tìm thấy tại vị trí: " + (i + 1));
                            found = true;
                            break;
                        }
                    }
                    if (found === false) alert("Không tìm thấy!");
                } 
                else if (menu === "4") {
                    let tenCu = prompt("Tên sách muốn sửa:");
                    for (let i = 0; i < danhSach.length; i++) {
                        if (danhSach[i] === tenCu) {
                            let tenMoi = prompt("Nhập tên mới:");
                            danhSach[i] = tenMoi;
                            break;
                        }
                    }
                }
            } while (menu !== "5" && menu !== null);
        }

        quanLyKhoSach();
    </script>
</body>
</html>
