<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let dsSV = [];
let dsSo = [];

function chuongTrinhTongHop() {
    while (true) {
        let menu = "1. Tính toán 2 số\n2. Quản lý sinh viên\n3. Tính hình học\n4. Xử lý số nguyên\n5. Chia mảng con\n6. Cấp số cộng\n7. Thoát";
        let chon = prompt(menu);

        if (chon === "7" || chon === null) break;

        if (chon === "1") {
            let p = prompt("1. +\n2. -\n3. *\n4. /");
            let a = Number(prompt("Số 1:"));
            let b = Number(prompt("Số 2:"));
            if (p === "1") alert(a + b);
            else if (p === "2") alert(a - b);
            else if (p === "3") alert(a * b);
            else if (p === "4") alert(b !== 0 ? a / b : "Lỗi chia 0");
        } 
        else if (chon === "2") {
            let p = prompt("1. Nhập\n2. Hiện\n3. Tìm\n4. Xóa");
            if (p === "1") {
                let n = Number(prompt("Số lượng:"));
                for (let i = 0; i < n; i++) dsSV.push(prompt("Tên SV " + (i + 1)));
            } else if (p === "2") {
                let s = "";
                for (let i = 0; i < dsSV.length; i++) s += (i + 1) + ". " + dsSV[i] + "\n";
                alert(s || "Trống");
            } else if (p === "3") {
                let t = prompt("Tìm tên:");
                let f = false;
                for (let x of dsSV) if (x === t) { alert("Thấy: " + x); f = true; break; }
                if (!f) alert("sinh viên không có trong danh sách");
            } else if (p === "4") {
                let t = prompt("Xóa tên:");
                for (let i = 0; i < dsSV.length; i++) {
                    if (dsSV[i] === t) { dsSV.splice(i, 1); alert("Đã xóa"); break; }
                }
            }
        }
        else if (chon === "3") {
            let p = prompt("1. S tròn\n2. C tròn\n3. S chữ nhật\n4. C chữ nhật");
            if (p === "1" || p === "2") {
                let r = Number(prompt("R:"));
                alert(p === "1" ? 3.14 * r * r : 2 * 3.14 * r);
            } else {
                let d = Number(prompt("Dài:"));
                let r = Number(prompt("Rộng:"));
                alert(p === "3" ? d * r : (d + r) * 2);
            }
        }
        else if (chon === "4") {
            let p = prompt("1. Nhập\n2. TB cộng\n3. Chẵn lớn nhất\n4. Lẻ nhỏ nhất");
            if (p === "1") {
                let n = Number(prompt("Số lượng:"));
                for (let i = 0; i < n; i++) dsSo.push(Number(prompt("Số " + (i + 1))));
            } else if (p === "2") {
                let t = 0;
                for (let x of dsSo) t += x;
                alert(dsSo.length > 0 ? t / dsSo.length : 0);
            } else if (p === "3") {
                let m = -Infinity;
                for (let x of dsSo) if (x % 2 === 0 && x > m) m = x;
                alert(m === -Infinity ? "Không có" : m);
            } else if (p === "4") {
                let m = Infinity;
                for (let x of dsSo) if (x % 2 !== 0 && x < m) m = x;
                alert(m === Infinity ? "Không có" : m);
            }
        }
        else if (chon === "5") {
            let arr = [1, 2, 3, 4, 5, 6, 7, 8];
            let n = Number(prompt("Kích thước n:"));
            if (isNaN(n)) alert("dữ liệu không hợp lệ");
            else {
                let kq = [];
                for (let i = 0; i < arr.length; i += n) kq.push(arr.slice(i, i + n));
                alert(JSON.stringify(kq));
            }
        }
        else if (chon === "6") {
            let arr = [2, 4, 6, 8];
            let d = arr[1] - arr[0];
            let ok = true;
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i+1] - arr[i] !== d) { ok = false; break; }
            }
            alert(ok ? "TRUE" : "FALSE");
        }
    }
}

chuongTrinhTongHop();
    </script>
</body>
</html>
