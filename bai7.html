<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = 6;
        let arr = [2, 4, 6, 1, 8, 9];

        if (n < 0) {
            console.log("Số lượng phần tử không được nhỏ hơn 0");
        } else if (n === 0 || arr.length === 0) {
            console.log("Mảng không có phần tử nào");
        } else {
            let countNumbers = 0;
            let digitsOnly = "";
            let maxEven = -Infinity;
            let hasEven = false;

            for (let i = 0; i < arr.length; i++) {
                let item = arr[i];

                if (item !== "" && !isNaN(item) && typeof item !== "boolean") {
                    countNumbers++;
                    let num = Number(item);
                    if (num % 2 === 0) {
                        if (num > maxEven) {
                            maxEven = num;
                        }
                        hasEven = true;
                    }
                }

                let itemStr = String(item);
                for (let j = 0; j < itemStr.length; j++) {
                    if (itemStr[j] >= '0' && itemStr[j] <= '9') {
                        digitsOnly += itemStr[j] + " ";
                    }
                }
            }

            if (hasEven) {
                console.log(maxEven);
            }

            if (countNumbers > 0) {
                console.log(countNumbers);
            } else {
                console.log("Không có phần tử nào là số");
            }

            if (digitsOnly !== "") {
                console.log(digitsOnly.trim());
            } else {
                console.log("Không có ký tự số");
            }
        }

        let falsyInput = ["", false, 0, 5, 10, "Hello world!"];
        let truthyResult = [];
        for (let i = 0; i < falsyInput.length; i++) {
            if (falsyInput[i]) {
                truthyResult[truthyResult.length] = falsyInput[i];
            }
        }
        console.log(truthyResult);
    </script>
</body>

</html>
