<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let squad = [
    { id: 1, name: "Nguyen Van A", goals: 10, position: "FW" },
    { id: 2, name: "Tran Van B", goals: 5,  position: "MF" },
    { id: 3, name: "Le Van C",   goals: 0,  position: "DF" },
    { id: 4, name: "Pham Van D", goals: 12, position: "FW" },
    { id: 5, name: "Dang Van E", goals: 0,  position: "GK" }
];

function mainMenu() {
    let choice;
    do {
        choice = prompt(
            "--- QUẢN LÝ ĐỘI BÓNG (OBJECT) ---\n" +
            "1. Xem danh sách\n" +
            "2. Thêm cầu thủ\n" +
            "3. Tìm kiếm (theo ID)\n" +
            "4. Cập nhật bàn thắng\n" +
            "5. Xóa cầu thủ\n" +
            "0. Thoát"
        );

        if (choice === "1") {
            let out = "=> DANH SÁCH:\n";
            squad.forEach(p => out += `Mã ${p.id} - ${p.name} (${p.position}): ${p.goals} bàn\n`);
            alert(out);
        } 
        else if (choice === "2") {
            let name = prompt("Tên:");
            let goals = parseInt(prompt("Bàn thắng:"));
            let pos = prompt("Vị trí:");
            squad.push({ 
                id: squad.length > 0 ? squad[squad.length - 1].id + 1 : 1, 
                name, goals, position: pos 
            });
        } 
        else if (choice === "3") {
            let id = parseInt(prompt("ID cần tìm:"));
            let p = squad.find(x => x.id === id);
            alert(p ? `Tìm thấy: ${p.name} - ${p.position}` : "Không tìm thấy");
        } 
        else if (choice === "4") {
            let id = parseInt(prompt("ID ghi bàn:"));
            let p = squad.find(x => x.id === id);
            if (p) {
                p.goals++;
                alert(`Đã cập nhật: ${p.name} hiện có ${p.goals} bàn.`);
            }
        } 
        else if (choice === "5") {
            let id = parseInt(prompt("ID cần xóa:"));
            let index = squad.findIndex(x => x.id === id);
            if (index !== -1) squad.splice(index, 1);
        }
    } while (choice !== "0" && choice !== null);
}

mainMenu();
    </script>
</body>
</html>
