<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Giỏ hàng - LocalStorage</title>
    <style>
        /* --- CSS STYLES --- */
        :root {
            --primary-color: #2563eb;
            --danger-color: #dc2626;
            --success-color: #16a34a;
            --bg-color: #f8fafc;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        h1,
        h2 {
            text-align: center;
            color: #0f172a;
        }

        /* Product Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .product-card {
            border: 1px solid #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--danger-color);
            margin: 10px 0;
        }

        /* Cart Table */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }

        th {
            background-color: #f1f5f9;
        }

        /* Buttons */
        button {
            cursor: pointer;
            border: none;
            border-radius: 5px;
            padding: 8px 16px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        .btn-add {
            background-color: var(--primary-color);
            color: white;
            width: 100%;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 5px 10px;
        }

        .btn-clear {
            background-color: var(--danger-color);
            color: white;
            margin-top: 20px;
            display: block;
            width: 100%;
        }

        .qty-btn {
            background-color: #e2e8f0;
            padding: 2px 10px;
            margin: 0 5px;
        }

        /* Summary */
        .summary-box {
            margin-top: 20px;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            border-left: 5px solid var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #64748b;
            font-style: italic;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Cửa Hàng Công Nghệ</h1>

        <section>
            <h2>Danh sách sản phẩm</h2>
            <div id="product-list" class="product-grid">
            </div>
        </section>

        <hr style="margin: 40px 0; border: 0; border-top: 1px solid #eee;">

        <section id="cart-section">
            <h2>Giỏ hàng của bạn</h2>
            <div id="cart-container">
            </div>

            <div id="cart-summary" class="summary-box" style="display: none;">
            </div>

            <button id="btn-clear-all" class="btn-clear" style="display: none;">Xóa Toàn Bộ Giỏ Hàng</button>
        </section>
    </div>

    <script>
        /* --- JAVASCRIPT LOGIC --- */

        // 1. Dữ liệu mẫu (Fixed)
        const products = [
            {
                id: 1,
                name: "Tai nghe Bluetooth",
                price: 350000,
                image: "https://via.placeholder.com/200x200?text=Tai+Nghe",
                description: "Tai nghe không dây pin 8 giờ."
            },
            {
                id: 2,
                name: "Chuột không dây",
                price: 250000,
                image: "https://via.placeholder.com/200x200?text=Chuot",
                description: "Chuột Silent, DPI 1600."
            },
            {
                id: 3,
                name: "Bàn phím cơ",
                price: 1200000,
                image: "https://via.placeholder.com/200x200?text=Keyboard",
                description: "Bàn phím RGB Blue Switch."
            }
        ];

        // 2. Khởi tạo giỏ hàng từ LocalStorage
        let cart = [];
        function initCart() {
            try {
                const data = localStorage.getItem('shopping_cart');
                cart = data ? JSON.parse(data) : [];
            } catch (e) {
                console.error("Dữ liệu lỗi, reset giỏ hàng");
                cart = [];
                saveCart();
            }
        }

        // 3. Tiện ích
        const formatVND = (num) => num.toLocaleString('vi-VN') + " VNĐ";

        function saveCart() {
            localStorage.setItem('shopping_cart', JSON.stringify(cart));
            renderCart();
        }

        // 4. Render Sản phẩm
        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" alt="${p.name}">
                    <h3>${p.name}</h3>
                    <p style="font-size: 0.9em; color: #666;">${p.description}</p>
                    <p class="price">${formatVND(p.price)}</p>
                    <button class="btn-add" onclick="addToCart(${p.id})">Thêm vào giỏ</button>
                </div>
            `).join('');
        }

        // 5. Thao tác giỏ hàng
        window.addToCart = (id) => {
            const product = products.find(p => p.id === id);
            const itemInCart = cart.find(item => item.id === id);

            if (itemInCart) {
                itemInCart.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
        };

        window.changeQty = (id, delta) => {
            const item = cart.find(i => i.id === id);
            if (!item) return;

            item.quantity += delta;
            if (item.quantity <= 0) {
                // Tự động xóa nếu giảm xuống 0
                cart = cart.filter(i => i.id !== id);
            }
            saveCart();
        };

        window.removeItem = (id) => {
            const item = cart.find(i => i.id === id);
            if (confirm(`Bạn chắc chắn muốn xóa "${item.name}"?`)) {
                cart = cart.filter(i => i.id !== id);
                saveCart();
            }
        };

        document.getElementById('btn-clear-all').onclick = () => {
            if (confirm("CẢNH BÁO: Xóa toàn bộ giỏ hàng?")) {
                cart = [];
                saveCart();
            }
        };

        // 6. Render Giỏ hàng & Thống kê
        function renderCart() {
            const container = document.getElementById('cart-container');
            const summary = document.getElementById('cart-summary');
            const clearBtn = document.getElementById('btn-clear-all');

            if (cart.length === 0) {
                container.innerHTML = `<div class="empty-state">Giỏ hàng đang trống. Hãy chọn sản phẩm!</div>`;
                summary.style.display = "none";
                clearBtn.style.display = "none";
                return;
            }

            let totalItems = cart.length;
            let totalQty = 0;
            let totalPrice = 0;

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Xóa</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            cart.forEach(item => {
                const subtotal = item.price * item.quantity;
                totalQty += item.quantity;
                totalPrice += subtotal;

                html += `
                    <tr>
                        <td><strong>${item.name}</strong></td>
                        <td>${formatVND(item.price)}</td>
                        <td>
                            <button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button>
                            ${item.quantity}
                            <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
                        </td>
                        <td>${formatVND(subtotal)}</td>
                        <td><button class="btn-delete" onclick="removeItem(${item.id})">X</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;

            // Cập nhật thống kê
            summary.style.display = "block";
            clearBtn.style.display = "block";
            summary.innerHTML = `
                <div style="display: flex; justify-content: space-between;">
                    <div>
                        <p>Số dòng sản phẩm: <strong>${totalItems}</strong></p>
                        <p>Tổng số lượng: <strong>${totalQty}</strong></p>
                    </div>
                    <div style="text-align: right;">
                        <p style="font-size: 1.2em;">Tổng tiền phải trả:</p>
                        <p style="font-size: 1.5em; color: var(--danger-color); font-weight: bold;">${formatVND(totalPrice)}</p>
                    </div>
                </div>
            `;
        }

        // Chạy khi trang load
        initCart();
        renderProducts();
        renderCart();

    </script>
</body>

</html>
