<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực Đơn Món Ăn Yêu Thích</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .food-card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .food-card:hover {
            transform: translateY(-5px);
        }

        .food-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .food-info {
            padding: 20px;
        }

        .food-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
        }

        .like-count {
            font-size: 1rem;
            color: #666;
            margin-bottom: 15px;
        }

        .like-count span {
            color: #e74c3c;
            font-weight: bold;
        }

        .btn-like {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-like:hover {
            background-color: #c0392b;
        }

        .btn-like:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>Thực Đơn Món Ăn</h2>
        <div class="food-grid" id="foodContainer">
        </div>
    </div>

    <script>
        const defaultFoods = [
            {
                id: 1,
                name: "Bún bò Huế",
                image: "https://i.ytimg.com/vi/CSl9I1dGX9s/maxresdefault.jpg",
                likes: 0
            },
            {
                id: 2,
                name: "Phở bò Hà Nội",
                image: "https://static.vinwonders.com/production/pho-bo-ha-noi.jpeg",
                likes: 0
            },
            {
                id: 3,
                name: "Cơm tấm Sài Gòn",
                image: "https://static.vinwonders.com/production/com-tam-sai-gon-thumb.jpg",
                likes: 0
            }
        ];

        let foods = JSON.parse(localStorage.getItem('foods_data')) || defaultFoods;

        const foodContainer = document.getElementById('foodContainer');

        function renderFoods() {
            foodContainer.innerHTML = '';

            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.innerHTML = `
                <img src="${food.image}" alt="${food.name}">
                <div class="food-info">
                    <div class="food-name">${food.name}</div>
                    <div class="like-count">Lượt thích: <span>${food.likes}</span></div>
                    <button class="btn-like" onclick="handleLike(${food.id})">Thích +1</button>
                </div>
            `;
                foodContainer.appendChild(card);
            });
        }

        function handleLike(id) {
            const foodIndex = foods.findIndex(item => item.id === id);
            if (foodIndex !== -1) {
                foods[foodIndex].likes += 1;

                localStorage.setItem('foods_data', JSON.stringify(foods));

                renderFoods();
            }
        }

        renderFoods();
    </script>

</body>

</html>
