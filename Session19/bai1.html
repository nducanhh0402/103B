<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng người dùng</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-width: 300px;
        }

        input {
            padding: 10px;
            width: 80%;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn-save {
            background-color: #28a745;
            color: white;
        }

        .btn-change {
            background-color: #007bff;
            color: white;
            margin-top: 15px;
        }

        button:hover {
            opacity: 0.8;
        }

        .hidden {
            display: none;
        }

        #greeting {
            color: #d63384;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <div id="inputSection">
            <h3>Vui lòng nhập tên của bạn</h3>
            <input type="text" id="userNameInput" placeholder="Tên của bạn...">
            <br>
            <button class="btn-save" onclick="saveName()">Lưu</button>
        </div>

        <div id="welcomeSection" class="hidden">
            <p id="greeting"></p>
            <button class="btn-change" onclick="changeName()">Đổi tên</button>
        </div>
    </div>

    <script>
        const inputSection = document.getElementById('inputSection');
        const welcomeSection = document.getElementById('welcomeSection');
        const nameInput = document.getElementById('userNameInput');
        const greetingText = document.getElementById('greeting');

        function init() {
            const savedName = localStorage.getItem('username');
            if (savedName) {
                showGreeting(savedName);
            } else {
                showInput();
            }
        }

        function saveName() {
            const name = nameInput.value.trim();

            if (name === "") {
                alert("Tên không được để trống!");
                return;
            }

            localStorage.setItem('username', name);
            showGreeting(name);
        }

        function showGreeting(name) {
            greetingText.innerText = `Chào bạn, ${name}!`;
            inputSection.classList.add('hidden');
            welcomeSection.classList.remove('hidden');
        }

        function showInput() {
            inputSection.classList.remove('hidden');
            welcomeSection.classList.add('hidden');
            nameInput.value = "";
        }
        function changeName() {
            showInput();
        }

        init();
    </script>

</body>

</html>
