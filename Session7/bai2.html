<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let playerIds = ["P001", "P002", "P003", "P004", "P005"];
        let playerNames = ["Nguyễn Văn A", "Trần Thị B", "Lê Văn C", "Phạm Văn D", "Hoàng Thị E"];
        let playerJerseyNumbers = [10, 7, 8, 9, 11];

        function printTeamRoster() {
            console.log("Danh sách đội bóng:");
            for (let i = 0; i < playerIds.length; i++) {
                console.log((i + 1) + ". " + playerIds[i] + " - " + playerNames[i] + " - Số áo: " + playerJerseyNumbers[i]);
            }
        }

        function updatePlayerNameAndJersey(playerId, newName, newJerseyNumber) {
            let foundIndex = -1;
            for (let i = 0; i < playerIds.length; i++) {
                if (playerIds[i] === playerId) {
                    foundIndex = i;
                    break;
                }
            }

            if (foundIndex !== -1) {
                playerNames[foundIndex] = newName;
                playerJerseyNumbers[foundIndex] = newJerseyNumber;
                return true;
            } else {
                return false;
            }
        }

        let inputId = prompt("Nhập mã cầu thủ muốn cập nhật (ví dụ: P001):");

        let exists = false;
        for (let i = 0; i < playerIds.length; i++) {
            if (playerIds[i] === inputId) {
                exists = true;
                break;
            }
        }

        if (exists) {
            let newName = prompt("Nhập tên mới cho cầu thủ:");
            let newJersey = parseInt(prompt("Nhập số áo mới (số nguyên từ 1-99):"));

            let success = updatePlayerNameAndJersey(inputId, newName, newJersey);

            if (success) {
                alert("Cập nhật thành công!");
                printTeamRoster();
            }
        } else {
            alert("Không tìm thấy cầu thủ với mã này!");
        }
    </script>
</body>

</html>
