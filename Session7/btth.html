<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const players = [];
        const goals = [];

        function addPlayer(name, goal) {
            players.push(name);
            goals.push(parseInt(goal));
            console.log(`=> Đã thêm ${name} thành công.`);
        }

        function showSquad() {
            console.log("\n--- DANH SÁCH ĐỘI HÌNH ---");
            if (players.length === 0) {
                console.log("Hiện chưa có cầu thủ nào trong danh sách.");
            } else {
                players.forEach((name, index) => {
                    console.log(`${index + 1}. ${name} - ${goals[index]} bàn`);
                });
            }
        }

        const getTotalGoals = function () {
            let total = 0;
            if (goals.length === 0) {
                console.log("Không có bàn thắng");
            } else {
                for (let i = 0; i < goals.length; i++) {
                    total += goals[i];
                }
                return total;

            }

        };

        function findMostGoals(goalsArray) {
            if (goalsArray.length === 0) return 0;

            let max = goalsArray[0];{
                return Math.max(...goalsArray)
            }
        //     for (let i = 1; i < goalsArray.length; i++) {
        //         if (goalsArray[i] > max) {
        //             max = goalsArray[i];
        //         }
        //     }
        //     return max;
        // }
        function main() {
            let choice;
            do {
                console.log("\n--- QUẢN LÝ ĐỘI BÓNG ---");
                console.log("1. Nhập cầu thủ mới");
                console.log("2. Xem danh sách đội hình");
                console.log("3. Xem thành tích toàn đội");
                console.log("4. Tìm Vua phá lưới");
                console.log("0. Thoát");

                choice = prompt("Người dùng chọn (0-4):");

                switch (choice) {
                    case '1':
                        let name = prompt("Nhập tên cầu thủ:");
                        let goal = prompt("Nhập số bàn thắng:");
                        addPlayer(name, goal);
                        break;
                    case '2':
                        showSquad();
                        break;
                    case '3':
                        console.log(`=> Tổng số bàn thắng của cả đội là: ${getTotalGoals()} bàn.`);
                        break;
                    case '4':
                        let maxGoal = findMostGoals(goals);
                        if (maxGoal === 0 && players.length === 0) {
                            console.log("=> Chưa có dữ liệu cầu thủ.");
                        } else {
                            let topScorers = [];
                            goals.forEach((g, index) => {
                                if (g === maxGoal) topScorers.push(players[index]);
                            });

                            console.log(`=> Vua phá lưới hiện tại ghi được: ${maxGoal} bàn.`);
                            console.log(`=> Danh sách Vua phá lưới: ${topScorers.join(", ")}`);
                        }
                        break;
                    case '0':
                        console.log("Tạm biệt huấn luyện viên! Chúc đội bóng thi đấu tốt.");
                        break;
                    default:
                        console.log("Lựa chọn không hợp lệ. Vui lòng chọn lại!");
                }
            } while (choice !== '0');
        }
        main();
    </script>
</body>

</html>
