    <script>
        let students = [
            { id: 1, name: "Nguyen Van An", age: 20, gpa: 8.5, status: "active" },
            { id: 2, name: "Tran Thi Bich", age: 17, gpa: 7.2, status: "active" },
            { id: 3, name: "Le Hoang Cuong", age: 22, gpa: 9.1, status: "inactive" },
            { id: 4, name: "Pham Thi Dung", age: 19, gpa: 6.8, status: "active" },
        ];

        let addStudents = (students) => {
            let id = +prompt('Nhập vào id của sinh viên')
            let name = prompt(' Nhập vào tên của sinh viên')
            let age = +prompt(' Nhập tuổi của sinh viên')
            let gpa = +prompt(' Nhập điểm của sinh viên')
            let status = prompt(' Nhập trạng thái của sinh viên')

            let newStudents = {
                id: id,
                name: name,
                age: age,
                gpa: gpa,
                status: status
            };
            students.push(newStudents)
            console.table(students)
            alert(
                ` Thêm sinh viên thành công với id: ${newStudents.id} name: ${newStudents.name}`
            )
        }


        function displayStudents(Students) {
            console.table(Students);
            let result = "Danh sách hạt giống là: \n";
            Students.forEach((students) => {
                result += ID: ${ students.id) | Name: $(students.name}  } \n';
});
        console.log(result.padEnd);
}


        let choice;
        do {
            choice = +prompt(`Nhập lựa chọn của bạn 
    1. Thêm
    2.Sửa
    3. Xóa 
     `);

            switch (choice) {
                case 1:
                    console.log('Chức năng 1');
                    addStudents(students);
                    console.log(newStudents(students));
                    break;

                default:
                    break;
            }
        } while (choice !== 0);
    </script>
