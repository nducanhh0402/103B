<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = 5;
        let arr = ['a', '-2', 'd', '5', 'e'];

        if (n < 0) {
            console.log("Số lượng phần tử không được âm");
        } else if (n === 0 || arr.length === 0) {
            console.log("Mảng không có phần tử");
        } else {
            let count = 0;
            let digits = "";

            for (let i = 0; i < arr.length; i++) {
                let item = arr[i];
                let isNumber = false;

                if (item !== "" && !isNaN(item)) {
                    isNumber = true;
                }

                if (isNumber) {
                    count++;
                    for (let j = 0; j < item.length; j++) {
                        if (item[j] >= '0' && item[j] <= '9') {
                            digits += item[j] + " ";
                        }
                    }
                }
            }

            if (count === 0) {
                console.log("Không có phần tử nào là số");
            } else {
                console.log(count);
                if (digits !== "") {
                    console.log(digits.trim());
                }
            }
        }
    </script>
</body>

</html>
