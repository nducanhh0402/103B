<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var sachCu = prompt("Nhập số sách cũ:");
        var sachMoi = prompt("Nhập số sách mới nhập:");

        sachCu = Number(sachCu);
        sachMoi = Number(sachMoi);
        var tongSoSach = sachCu + sachMoi;
        document.write("Tổng số sách hiện tại là: " + tongSoSach);
        console.log("Tổng số sách hiện tại là: " + tongSoSach);
    </script>
</body>

</html>
