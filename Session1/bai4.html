<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var tenSach = prompt("Nhập tên cuốn sách:");

        var tenGoc = tenSach;
        var tenVietHoa = tenSach.toUpperCase();
        var tenVietThuong = tenSach.toLowerCase();

        console.log("Tên gốc: " + tenGoc);
        console.log("Tên viết thường: " + tenVietThuong);
        console.log("Tên viết hoa: " + tenVietHoa);
    </script>
</body>

</html>
