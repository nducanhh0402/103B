<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = 0;
        let arr = [];
        let choice;

        while (choice !== 8) {
            console.log("========== MENU ==========");
            console.log("1. Nhập số phần tử và giá trị");
            console.log("2. In ra giá trị các phần tử");
            console.log("3. In ra các phần tử chẵn và tính tổng");
            console.log("4. In ra giá trị lớn nhất và nhỏ nhất");
            console.log("5. In ra các số nguyên tố và tính tổng");
            console.log("6. Thống kê số lượng xuất hiện của một số");
            console.log("7. Thêm một phần tử vào vị trí chỉ định");
            console.log("8. Thoát");
            console.log("Bổ sung: Kiểm tra Fibonacci & Lọc Truthy");

            choice = Number(prompt("Lựa chọn của bạn:"));

            if (choice === 1) {
                n = Number(prompt("Nhập n:"));
                if (n < 0) {
                    console.log("Số lượng phần tử không được nhỏ hơn 0");
                    n = 0;
                } else {
                    arr = [];
                    for (let i = 0; i < n; i++) {
                        arr[i] = prompt("Nhập phần tử thứ " + i + ":");
                        if (!isNaN(arr[i]) && arr[i] !== "") {
                            arr[i] = Number(arr[i]);
                        }
                    }
                }
            } else if (choice === 2) {
                if (n === 0) {
                    console.log("Mảng không có phần tử nào");
                } else {
                    console.log(arr);
                }
            } else if (choice === 3) {
                let sumEven = 0;
                let evenElements = "";
                for (let i = 0; i < arr.length; i++) {
                    if (typeof arr[i] === "number" && arr[i] % 2 === 0) {
                        evenElements += arr[i] + " ";
                        sumEven += arr[i];
                    }
                }
                console.log("Các số chẵn: " + evenElements);
                console.log("Tổng: " + sumEven);
            } else if (choice === 4) {
                if (arr.length === 0) {
                    console.log("Mảng rỗng");
                } else {
                    let max = arr[0];
                    let min = arr[0];
                    for (let i = 1; i < arr.length; i++) {
                        if (arr[i] > max) max = arr[i];
                        if (arr[i] < min) min = arr[i];
                    }
                    console.log("Max: " + max + ", Min: " + min);
                }
            } else if (choice === 5) {
                let sumPrime = 0;
                for (let i = 0; i < arr.length; i++) {
                    let num = arr[i];
                    if (typeof num === "number" && num > 1) {
                        let isPrime = true;
                        for (let j = 2; j <= Math.sqrt(num); j++) {
                            if (num % j === 0) {
                                isPrime = false;
                                break;
                            }
                        }
                        if (isPrime) {
                            console.log(num);
                            sumPrime += num;
                        }
                    }
                }
                console.log("Tổng số nguyên tố: " + sumPrime);
            } else if (choice === 6) {
                let find = Number(prompt("Nhập số cần thống kê:"));
                let count = 0;
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i] === find) count++;
                }
                console.log("Số " + find + " xuất hiện " + count + " lần");
            } else if (choice === 7) {
                let val = prompt("Nhập giá trị cần thêm:");
                let pos = Number(prompt("Nhập vị trí (0 - " + arr.length + "):"));
                for (let i = arr.length; i > pos; i--) {
                    arr[i] = arr[i - 1];
                }
                arr[pos] = val;
                n = arr.length;
            } else if (choice === 9) {
                let isFibo = true;
                if (arr.length < 3) isFibo = false;
                else {
                    for (let i = 2; i < arr.length; i++) {
                        if (Number(arr[i]) !== Number(arr[i - 1]) + Number(arr[i - 2])) {
                            isFibo = false;
                            break;
                        }
                    }
                }
                console.log(isFibo ? "Là dãy số fibonacci" : "Không phải dãy số fibonacci");
            } else if (choice === 10) {
                let truthyArr = [];
                for (let i = 0; i < arr.length; i++) {
                    if (arr[i]) truthyArr[truthyArr.length] = arr[i];
                }
                console.log(truthyArr);
            }
        }
    </script>
</body>

</html>
