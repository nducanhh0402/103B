<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function generatePlayerSeasonReport(playerName, teamHistory) {
            const player = teamHistory.find(p => p.name === playerName);

            if (!player) return `Không tìm thấy cầu thủ ${playerName}`;

            const seasons = Object.entries(player.seasons);
            let totalMatches = 0, totalGoals = 0, totalAssists = 0, totalYellowCards = 0;
            let bestSeason = { season: "", goals: -1, assists: -1 };

            seasons.forEach(([year, stats]) => {
                totalMatches += stats.matches;
                totalGoals += stats.goals;
                totalAssists += stats.assists;
                totalYellowCards += stats.yellowCards;

                if (stats.goals > bestSeason.goals || (stats.goals === bestSeason.goals && stats.assists > bestSeason.assists)) {
                    bestSeason = { season: year, goals: stats.goals, assists: stats.assists };
                }
            });

            return {
                name: player.name,
                position: player.position,
                nationality: player.nationality,
                careerStats: {
                    totalMatches,
                    totalGoals,
                    totalAssists,
                    totalYellowCards,
                    averageGoalsPerMatch: Number((totalGoals / totalMatches).toFixed(2)),
                    averageAssistsPerMatch: Number((totalAssists / totalMatches).toFixed(2)),
                    bestSeason
                }
            };
        }
    </script>
</body>

</html>
