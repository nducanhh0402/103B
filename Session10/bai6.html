<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function generateRankingReport(minMatches, players) {
            const qualifiedPlayers = players
                .filter(p => p.matches >= minMatches)
                .map(p => {
                    const performanceScore = Number(((p.goals + p.assists) / p.matches).toFixed(2));
                    const efficiencyScore = Number((performanceScore - (p.yellowCards / p.matches) * 10).toFixed(2));
                    return { ...p, performanceScore, efficiencyScore };
                });

            qualifiedPlayers.sort((a, b) => {
                if (b.efficiencyScore !== a.efficiencyScore) return b.efficiencyScore - a.efficiencyScore;
                if (b.performanceScore !== a.performanceScore) return b.performanceScore - a.performanceScore;
                return b.goals - a.goals;
            });

            console.log(`XẾP HẠNG ĐỘI BÓNG (từ ${minMatches} trận trở lên)`);

            qualifiedPlayers.forEach((p, index) => {
                console.log(`${index + 1}. ${p.name} - Efficiency: ${p.efficiencyScore.toFixed(2)} | Performance: ${p.performanceScore.toFixed(2)} | Goals: ${p.goals}`);
            });

            const totalRanked = qualifiedPlayers.length;
            console.log(`Tổng số cầu thủ xếp hạng: ${totalRanked}`);

            if (totalRanked > 0) {
                console.log(`Cầu thủ xuất sắc nhất: ${qualifiedPlayers[0].name}`);

                const top3 = qualifiedPlayers.slice(0, 3);
                const avgEfficiencyTop3 = top3.reduce((sum, p) => sum + p.efficiencyScore, 0) / top3.length;
                console.log(`Trung bình efficiency top 3: ${avgEfficiencyTop3.toFixed(2)}`);
            }
        }

        generateRankingReport(30, players);
    </script>
</body>

</html>
