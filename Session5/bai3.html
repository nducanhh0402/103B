<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let booksId = [];
        let booksName = [];
        let inventoryQuantity = [];

        let soLoai = parseInt(prompt("Có bao nhiêu loại sách cần kiểm tra bổ sung hôm nay?"));

        for (let i = 1; i <= soLoai; i++) {
            let id = prompt(`Nhập mã sách thứ ${i}:`);
            let name = prompt(`Nhập tên sách thứ ${i}:`);
            let quantity = parseInt(prompt(`Nhập số lượng tồn kho của ${name}:`));

            booksId.push(id);
            booksName.push(name);
            inventoryQuantity.push(quantity);
        }

        console.log(`Danh sách sách cần xem xét bổ sung (${booksId.length} loại):`);

        let countLowStock = 0;
        let outOfStockIds = [];

        for (let i = 0; i < booksId.length; i++) {
            console.log(`${i + 1}. Mã: ${booksId[i]} - Tên: ${booksName[i]} - Còn: ${inventoryQuantity[i]} bản`);

            if (inventoryQuantity[i] <= 5) {
                countLowStock++;
            }

            if (inventoryQuantity[i] === 0) {
                outOfStockIds.push(booksId[i]);
            }
        }

        console.log(`Số sách có tồn kho <= 5 bản: ${countLowStock} loại`);
        console.log(`Các mã sách đã hết hàng (0 bản): ${outOfStockIds.join(", ")}`);
    </script>
</body>

</html>
