<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let booksId = [];
        let booksName = [];
        let booksCategory = [];
        let inventoryQuantity = [];

        let n = parseInt(prompt("Có bao nhiêu loại sách cần nhập thông tin hôm nay?"));

        for (let i = 1; i <= n; i++) {
            let id;
            while (true) {
                id = prompt(`Nhập mã sách thứ ${i}:`);
                if (id && !booksId.includes(id)) break;
                alert("Mã sách không được để trống và không được trùng lặp!");
            }

            let name;
            while (true) {
                name = prompt(`Nhập tên sách thứ ${i}:`);
                if (name) break;
            }

            let category = prompt(`Nhập các thể loại của sách thứ ${i} (cách nhau bởi dấu phẩy):`);
            let quantity = parseInt(prompt(`Nhập số lượng tồn kho của sách thứ ${i}:`));

            booksId.push(id);
            booksName.push(name);
            booksCategory.push(category);
            inventoryQuantity.push(quantity);
        }

        let countLapTrinh = 0;
        let jsWebBooks = [];
        let minIndex = 0;

        for (let i = 0; i < booksId.length; i++) {
            if (booksCategory[i].toLowerCase().includes("lập trình")) {
                countLapTrinh++;
            }

            let catLower = booksCategory[i].toLowerCase();
            if (catLower.includes("javascript") && catLower.includes("web")) {
                jsWebBooks.push(booksId[i]);
            }

            if (inventoryQuantity[i] < inventoryQuantity[minIndex]) {
                minIndex = i;
            }
        }

        console.log(`Tổng số sách thuộc thể loại 'Lập trình': ${countLapTrinh}`);
        console.log(`Danh sách mã sách thuộc cả hai thể loại 'JavaScript' và 'Web':`);
        console.log(jsWebBooks.length > 0 ? jsWebBooks.join("\n") : "Không có");
        console.log(`Loại sách có số lượng tồn kho thấp nhất:`);
        console.log(`Mã sách: ${booksId[minIndex]}, Tên sách: ${booksName[minIndex]}, Tồn kho: ${inventoryQuantity[minIndex]}`);
    </script>
</body>

</html>
